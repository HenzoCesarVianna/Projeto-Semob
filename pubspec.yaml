name: projeto_semob_henzo
description: "Dashboard SEMOB - Gestão e Importação do Transporte Público Municipal de São Caetano do Sul."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # LAYOUT ORIGINAL: MAPA, GRÁFICOS E FORMATAÇÃO DE DADOS
  # ---------------------------------------------------------------------------
  flutter_map: ^6.1.0        # Exibição do mapa interativo (OpenStreetMap)
  latlong2: ^0.9.0           # Coordenadas geográficas das linhas de autocarro
  fl_chart: ^0.66.0          # Gráficos de barras e volume de passageiros
  intl: ^0.19.0              # Formatação de moedas (R$) e números decimais

  # ---------------------------------------------------------------------------
  # MÓDULO DE IMPORTAÇÃO E PROCESSAMENTO DE RELATÓRIOS
  # ---------------------------------------------------------------------------
  file_picker: ^8.0.0        # Seleção de ficheiros (.zip, .html, .xlsx) do sistema
  excel: ^4.0.0              # Leitura e extração de dados de folhas Excel (.xlsx)
  archive: ^3.3.0            # Descompactação de pacotes .ZIP de relatórios
  html: ^0.15.4              # Parser e extração de tabelas HTML (.html / .htm)
  pdf: ^3.10.8               # Geração e estruturação de documentos PDF
  printing: ^5.11.0          # Exportação e impressão de relatórios PDF

  # ---------------------------------------------------------------------------
  # RECURSOS VISUAIS E ÍCONES
  # ---------------------------------------------------------------------------
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Caso utilize imagens/logos locais (como o brasão de São Caetano), adicione os assets aqui:
  # assets:
  #   - assets/images/